name: Release single HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -e "const html=require('fs').readFileSync('index.html','utf8'); const m=html.match(/<title>[^<]*\\bv(\\d+\\.\\d+\\.\\d+)\\b/); if(!m) process.exit(1); process.stdout.write(m[1]);")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build single HTML files
        run: npm run build

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          export ONLINE="wan-v${VERSION}-yes.html"
          export OFFLINE="wan-v${VERSION}-no.html"
          export APK="web-manager-v${VERSION}.apk"
          test -f "dist/${ONLINE}"
          test -f "dist/${OFFLINE}"
          ls -lh dist
          export NOTES_FILE="dist/release-notes.md"
          node scripts/release-notes.mjs --github
          python3 scripts/publish-release.py
