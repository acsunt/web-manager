plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('../index.html')
if (!versionFile.exists()) {
    throw new GradleException('找不到 ../index.html，无法读取 APK 版本号')
}
def versionMatcher = (versionFile.getText('UTF-8') =~ /<title>[^<]*\bv(\d+\.\d+\.\d+)\b/)
if (!versionMatcher.find()) {
    throw new GradleException('index.html 的 <title> 缺少 vMAJOR.MINOR.PATCH')
}
def appVersionName = versionMatcher.group(1)
def versionParts = appVersionName.split('\\.').collect { it.toInteger() }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

android {
    namespace 'com.webmanager.app'
    compileSdk 35
    // 安装器按 APK 内 lib/<abi>/*.so 判断 32/64 位。没有 native 库时，ABI 分包也会打出两份几乎一样大的纯 Java APK，并常被显示成 32 位。
    // 预编译 .so 放在 jniLibs，不依赖本机 CMake。源码在 src/main/cpp，可用 npm run native 重编。

    defaultConfig {
        applicationId 'com.webmanager.app'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        if (abi == 'armeabi-v7a') {
            output.versionCodeOverride = variant.versionCode * 10 + 1
        } else if (abi == 'arm64-v8a') {
            output.versionCodeOverride = variant.versionCode * 10 + 2
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
